<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserve a Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container py-5">
        <section class="reservation-card mx-auto">
            <h1 class="h2 mb-4">Reserve a Table</h1>

            <form action="#" method="get">
                <div class="mb-3">
                    <label for="customerName" class="form-label">Your name *</label>
                    <input type="text" class="form-control" id="customerName" name="customerName" autocomplete="name" required>
                </div>

                <div class="mb-3">
                    <label for="customerEmail" class="form-label">Email *</label>
                    <input type="email" class="form-control" id="customerEmail" name="customerEmail" autocomplete="email" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone *</label>
                    <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel" required>
                </div>

                <div class="mb-3">
                    <label for="guests" class="form-label">Guests *</label>
                    <input type="number" class="form-control" id="guests" name="guests" min="1" max="20" step="1" value="2" required>
                </div>

                <div class="mb-3">
                    <label for="reservationDate" class="form-label">Date *</label>
                    <input type="date" class="form-control" id="reservationDate" name="reservationDate" required>
                </div>

                <fieldset class="mb-3">
                    <legend class="form-label">Seating *</legend>

                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="inside" name="seating" value="inside" required>
                        <label class="form-check-label" for="inside">
                            Inside
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="terrace" name="seating" value="terrace" required>
                        <label class="form-check-label" for="terrace">
                            Terrace
                        </label>
                    </div>
                </fieldset>

                <div class="mb-3">
                    <label for="meal" class="form-label">Preferred time *</label>
                    <select class="form-select" id="meal" name="meal" required>
                        <option value="" selected disabled>Choose...</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="comments" class="form-label">Comments</label>
                    <textarea class="form-control" id="comments" name="comments" rows="3" placeholder="Special requests (optional)"></textarea>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the reservation terms *
                    </label>
                </div>

                <button type="submit" class="btn btn-reserve w-100">
                    Reserve
                </button>
            </form>
        </section>
    </main>
</body>

</html>
